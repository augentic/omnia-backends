[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
authors = ["Augentic <https://augentic.io>"]
categories = ["wasm", "api-bindings"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["wasi", "wasm", "backend", "runtime", "omnia"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia-backends"
rust-version = "1.97"
version = "0.31.0"

# conventions:begin lints/rust
[workspace.lints.rust]
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
# conventions:end lints/rust

# conventions:begin lints/clippy
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cherry-picked lints from the `restriction` group 
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# conventions:end lints/clippy

multiple_crate_versions = "allow"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
azure_core = "1.1.0"
azure_identity = "1.0.0"
azure_storage_blob = "1.1.0"
base64ct = { version = "1.8.3", features = ["std"] }
bytes = "1.12.1"
chrono = "0.4.45"
fromenv = "0.1.0"
futures = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
jsonschema = { version = "0.58.0", default-features = false }
libc = "0.2"
process-wrap = { version = "10.0.1", default-features = false }
prost = "0.14.4"
prost-types = "0.14.4"
rustls = { version = "0.23.45", default-features = false, features = ["logging", "ring", "std"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
sha2 = "0.11.0"
tempfile = "3.27.0"
test-programs = { path = "crates/test-programs" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"

omnia = "0.37.0"
omnia-core = { version = "0.37.0", default-features = false }
omnia-plugin = "0.37.0"
omnia-sdk = { version = "0.37.0", default-features = false }
omnia-test = { version = "0.37.0", default-features = false }
omnia-wasi-blobstore = "0.37.0"
omnia-wasi-docstore = "0.37.0"
omnia-wasi-identity = { version = "0.37.0", default-features = false }
omnia-wasi-keyvalue = "0.37.0"
omnia-wasi-messaging = "0.37.0"
omnia-wasi-model = "0.37.0"
omnia-wasi-otel = "0.37.0"
omnia-wasi-sql = { version = "0.37.0", default-features = false }
omnia-wasi-vault = "0.37.0"

[patch.crates-io]
omnia = { git = "https://github.com/augentic/omnia" }
omnia-core = { git = "https://github.com/augentic/omnia" }
omnia-plugin = { git = "https://github.com/augentic/omnia" }
omnia-sdk = { git = "https://github.com/augentic/omnia" }
omnia-test = { git = "https://github.com/augentic/omnia" }
omnia-wasi-blobstore = { git = "https://github.com/augentic/omnia" }
omnia-wasi-docstore = { git = "https://github.com/augentic/omnia" }
omnia-wasi-identity = { git = "https://github.com/augentic/omnia" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia" }
omnia-wasi-messaging = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
omnia-wasi-sql = { git = "https://github.com/augentic/omnia" }
omnia-wasi-vault = { git = "https://github.com/augentic/omnia" }

[profile.release]
lto = true
opt-level = "s"
strip = true

# Unoptimized cranelift is ~10x slower.
[profile.dev.package]
cranelift-codegen = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }
