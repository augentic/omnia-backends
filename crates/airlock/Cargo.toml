[package]
name = "omnia-airlock"
description = "Host subprocess airlock for the model trust domain: supervised child, scrubbed environment, kernel boundary, and vetted egress"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
libc.workspace = true
process-wrap = { workspace = true, features = ["kill-on-drop", "process-session", "tokio1"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[[bin]]
name = "airlock-probe"
path = "tests/support/probe/main.rs"
test = false
bench = false
doc = false
