[package]
name = "omnia-azure-table"
description = "Azure backend table storage provider implementing wasi-docstore"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
base64ct.workspace = true
chrono.workspace = true
fromenv.workspace = true
futures.workspace = true
hmac = "0.13.0"
omnia.workspace = true
omnia-wasi-docstore.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
urlencoding.workspace = true

# The live test (`tests/live.rs`) is a separate crate; it needs tokio's test
# runtime, which the library dependencies do not enable.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
