[package]
name = "omnia-cursor"
description = "Cursor SDK bridge model backend (the omnia:model boundary)"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# The protocol-faithful fake `cursor-sdk-bridge` the e2e suites spawn
# (`fake-cursor-sdk-bridge`), and the suites themselves.
fake-bridge = ["dep:libc", "http-body-util/channel", "tokio/rt-multi-thread"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
fromenv.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
libc = { workspace = true, optional = true }
# Pinned to the local omnia 0.36.0 line via the workspace `[patch.crates-io]`
# override (the `omnia-wasi-model` host crate is unreleased on crates.io).
omnia.workspace = true
omnia-wasi-model.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures.workspace = true
omnia-test = { workspace = true, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber.workspace = true

# The fake bridge is a binary of this package so the suites find it through
# `CARGO_BIN_EXE_fake-cursor-sdk-bridge` and link it onto `PATH` as
# `cursor-sdk-bridge`; its source is `tests/support/fake_bridge`.
[[bin]]
name = "fake-cursor-sdk-bridge"
path = "tests/support/fake_bridge/main.rs"
required-features = ["fake-bridge"]
test = false
doc = false

[[test]]
name = "model"
required-features = ["fake-bridge"]

[[test]]
name = "bridge"
required-features = ["fake-bridge"]
