[package]
name = "omnia-cursor"
description = "Cursor SDK bridge model backend (the omnia:model boundary)"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
fromenv.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
omnia.workspace = true
omnia-wasi-model.workspace = true
process-wrap = { workspace = true, features = ["kill-on-drop", "process-group", "tokio1"] }
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures.workspace = true
libc.workspace = true
omnia-test = { workspace = true, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber.workspace = true

# The fake bridge is a binary of this package so the suites find it through
# `CARGO_BIN_EXE_fake-cursor-sdk-bridge` and link it onto `PATH` as
# `cursor-sdk-bridge`. Its source is `tests/support/fake_bridge`, compiled
# against `[dependencies]` alone (hence `http-body-util/channel` above); the
# suites' side of that module is `cfg(test)`, which this binary never is
# because no test or bench harness is ever built for it.
[[bin]]
name = "fake-cursor-sdk-bridge"
path = "tests/support/fake_bridge/main.rs"
test = false
bench = false
doc = false
