[package]
name = "omnia-filesystem"
description = "Filesystem provider for blobstore and keyvalue"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
fromenv.workspace = true
futures.workspace = true
omnia.workspace = true
omnia-plugin.workspace = true
omnia-wasi-blobstore.workspace = true
omnia-wasi-keyvalue.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

# Container operations are futures; the test suite needs a runtime.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
