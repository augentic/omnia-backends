[package]
name = "omnia-genai"
description = "Multi-provider generative-AI model backend (the omnia:model boundary)"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
fromenv.workspace = true
genai = "0.6.5"
omnia.workspace = true
omnia-wasi-model.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Integration tests are separate crates and do not inherit the library's normal
# dependencies, so the ones the suites drive are repeated here. The hyper
# server stack stands up the fake OpenAI-compatible provider the `model` and
# `provider` suites point `ConnectOptions::endpoint` at; `omnia-test` and
# `test-programs` run the guest components through the runtime.
[dev-dependencies]
bytes.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
omnia-test = { workspace = true, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
