[package]
name = "omnia-genai"
description = "Multi-provider generative-AI model backend (the omnia:model boundary)"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
fromenv.workspace = true
genai = "0.6.5"
omnia.workspace = true
omnia-wasi-model.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Integration tests are separate crates and do not inherit the library's normal
# dependencies, so the ones the live tests (`tests/live.rs`) drive are
# repeated here.
[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
