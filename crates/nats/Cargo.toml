[package]
name = "omnia-nats"
description = "NATS provider for messaging, keyvalue, and blobstore"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
# `server_2_11` carries the per-message TTL the key-value bucket expires entries by.
async-nats = { version = "0.52.0", features = ["server_2_11"] }
bytes.workspace = true
chrono.workspace = true
fromenv.workspace = true
futures.workspace = true
nkeys = "0.4.5"
omnia.workspace = true
omnia-wasi-blobstore.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
tokio.workspace = true
tracing.workspace = true

# The live test (`tests/live.rs`) is a separate crate; it needs tokio's test
# runtime features, which the library dependency does not enable.
[dev-dependencies]
omnia-test = { workspace = true, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
