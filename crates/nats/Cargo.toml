[package]
name = "omnia-nats"
description = "NATS provider for messaging, keyvalue, and blobstore"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
async-nats = "0.50.0"
bytes.workspace = true
chrono.workspace = true
fromenv.workspace = true
futures.workspace = true
nkeys = "0.4.5"
omnia-backend = { workspace = true, features = ["blobstore", "keyvalue", "messaging"] }
tokio.workspace = true
tracing.workspace = true

# The live test (`tests/live.rs`) is a separate crate; it needs tokio's test
# runtime features, which the library dependency does not enable.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
