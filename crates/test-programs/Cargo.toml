[package]
name = "test-programs"
description = "Guest scenario programs driven by the backend e2e suites, and their compiled artifacts"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
autoexamples = false

[lints]
workspace = true

# The guest side: `build.rs` (through `omnia_test::build`) compiles every
# `programs/<capability>/<scenario>.rs` as an `[[example]]` cdylib for
# `wasm32-wasip2`. The native side has no dependencies: it is the generated
# artifact paths alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
omnia-sdk = { workspace = true, features = ["command"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Generated by build.rs from programs/<group>/<scenario>.rs.

[[example]]
name = "model_check_accepted"
path = "programs/model/check_accepted.rs"
crate-type = ["cdylib"]

[[example]]
name = "model_check_corrected"
path = "programs/model/check_corrected.rs"
crate-type = ["cdylib"]

[[example]]
name = "model_check_exhausted"
path = "programs/model/check_exhausted.rs"
crate-type = ["cdylib"]

[[example]]
name = "model_echo_text"
path = "programs/model/echo_text.rs"
crate-type = ["cdylib"]

[[example]]
name = "model_expect_error"
path = "programs/model/expect_error.rs"
crate-type = ["cdylib"]

[[example]]
name = "model_fanout"
path = "programs/model/fanout.rs"
crate-type = ["cdylib"]

[[example]]
name = "model_fanout_abandon"
path = "programs/model/fanout_abandon.rs"
