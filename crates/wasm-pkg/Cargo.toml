[package]
name = "omnia-wasm-pkg"
description = "Registry acquirer for omnia's plugin loader over wasm-pkg-client"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
omnia.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing.workspace = true
wasm-pkg-client.workspace = true

# Acquisition is a future; the test suite needs a runtime.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wat.workspace = true
