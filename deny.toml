# https://embarkstudios.github.io/cargo-deny

[graph]
all-features = true
# The guest programs in `crates/test-programs` are compiled for wasm32-wasip2,
# and their dependencies live behind `[target.'cfg(target_arch = "wasm32")']`.
# Without that target in the graph those edges are pruned and the workspace
# dependencies only they use (`omnia-sdk`) are reported as unused.
targets = ["aarch64-apple-darwin", "wasm32-wasip2"]

[output]
feature-depth = 1

[advisories]
unmaintained = 'workspace'
# ignore = [
#   { id = "RUSTSEC-2026-0194", reason = "typespec 1.0.0 pins quick-xml 0.39.x" },
#   { id = "RUSTSEC-2026-0195", reason = "same" },
# ]

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
name = "ring"

[bans]
deny = [
  { name = "tokio", deny-multiple-versions = true },
]
multiple-versions = "allow"
skip = []
skip-tree = []
wildcards = "allow"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "warn"
