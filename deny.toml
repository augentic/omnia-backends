# https://embarkstudios.github.io/cargo-deny

[graph]
all-features = true
# The non-dev graph of the 14 backend crates must remain free of `wasmtime`
# and `omnia-core`; `examples` and the e2e suites dev-depend on `omnia` and
# `omnia-test`.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
exclude = ["examples", "test-programs"]
exclude-dev = true

[output]
feature-depth = 1

[advisories]
unmaintained = "workspace"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[[licenses.clarify]]
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
name = "ring"

[bans]
deny = [
  { name = "tokio", deny-multiple-versions = true },
  { name = "wasmtime" },
  { name = "omnia-core" },
]
multiple-versions = "allow"
skip = []
skip-tree = []
wildcards = "allow"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
# `exclude-dev = true` and `exclude = ["examples", "test-programs"]` prune
# dev-only and example-only workspace dependencies from the graph.
unused = "allow"

[sources]
unknown-git = "deny"
# allow-git = ["https://github.com/augentic/omnia"]
