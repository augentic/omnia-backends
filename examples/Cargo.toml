[package]
name = "examples"
publish = false
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[[example]]
name = "cursor-wasm"
path = "cursor/guest.rs"
crate-type = ["cdylib"]

[[example]]
name = "cursor"
path = "cursor/runtime.rs"

[[example]]
name = "azure_blob"
path = "azure_blob/main.rs"

[[example]]
name = "azure_table"
path = "azure_table/main.rs"

# Every example here is clippy-checked for wasm32-wasip2 (`WASM32_PACKAGES` in
# mise.toml); the host-only ones gate their entry point with `cfg_select!`.
[dependencies]
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
dotenvy = "0.15.7"
omnia.workspace = true
omnia-azure-blob = { path = "../crates/azure-blob" }
omnia-azure-table = { path = "../crates/azure-table" }
omnia-cursor = { path = "../crates/cursor" }
omnia-wasi-blobstore.workspace = true
omnia-wasi-docstore.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
wasip3 = { version = "0.9.0", features = ["http-compat"] }
wit-bindgen = { version = "0.62.0", features = ["async-spawn"] }
