[task_config]
includes = ["git::https://github.com/augentic/toolkit.git//mise/rust.toml?ref=v0.3.0"]

# Knobs read by the included tasks. `WASM32_PACKAGES` mirrors `wasm-packages`
# in conventions.toml, which renders `.github/workflows/ci.yaml`; keep
# `publish.yaml` in step too, and `make conventions-check` holds the mirror.
#
# The backend crates link host-only libraries (wasmtime, tokio and the rest)
# and never build for wasm32-wasip2. The guest-capable members are the
# `test-programs` scenarios and the `examples` package, whose host-only
# examples are cfg-gated to an empty `main` on wasm32.
[env]
WASM32_PACKAGES = "test-programs examples"
